[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/pods/*ecommerce*/*/*.log
    Tag               ecommerce.*
    Parser            cri
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[OUTPUT]
    Name   stdout
    Match  ecommerce.*
